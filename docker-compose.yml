version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run backend/app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
